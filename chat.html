<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05030d">
<title>Brain Side — Chat, Code, Generate</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="glass.css">
<script src="theme.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{height:100vh;height:100dvh;display:flex;overflow:hidden;position:relative;z-index:1}
body.auth-loading .sidebar,body.auth-loading .main-content,body.auth-loading .profile-topbar{opacity:0;pointer-events:none}

.auth-loading-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:rgba(5,3,13,.85);backdrop-filter:blur(28px)}
:root[data-theme="light"] .auth-loading-overlay{background:rgba(238,241,246,.88)}
.auth-loading-overlay.show{display:flex}
.auth-loading-spinner{width:90px;height:90px;position:relative;display:flex;align-items:center;justify-content:center}
.auth-loading-ring{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);animation:authSpin .9s linear infinite}
.auth-loading-ring.ring-2{inset:8px;animation-duration:1.4s;animation-direction:reverse}
@keyframes authSpin{to{transform:rotate(360deg)}}
.auth-loading-logo{width:62px;height:62px}
.auth-loading-logo img{width:100%;height:100%;object-fit:contain}
.auth-loading-text{font-size:13.5px;font-weight:700;color:var(--text-primary);opacity:.85}

.error-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.85)}
.error-overlay.show{display:flex}
.error-box{max-width:600px;padding:22px;border-radius:18px;background:rgba(40,20,20,.95);border:1px solid rgba(255,80,80,.5);color:#fff;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:80vh;overflow:auto}
.error-box h3{margin:0 0 10px;font-size:14px;color:#ff6b6b}
.error-box button{margin-top:14px;padding:8px 16px;border-radius:10px;background:#ff3b30;color:#fff;border:none;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}

.profile-topbar{position:fixed;top:0;left:0;right:0;z-index:999;height:52px;margin:10px 14px 0;padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.06) 100%);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.24);box-shadow:0 8px 28px rgba(0,0,0,.35)}
:root[data-theme="light"] .profile-topbar{background:linear-gradient(135deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.55) 100%);border-color:rgba(255,255,255,.9)}
.profile-topbar-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:800;color:var(--text-primary);pointer-events:none;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-primary);background:transparent;border:none;cursor:pointer;padding:0;text-decoration:none}
.back-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.header-anon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);text-decoration:none}
.header-anon-btn svg{width:24px;height:24px;fill:currentColor}
.header-loading-spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:hdrSpin .8s linear infinite}
@keyframes hdrSpin{to{transform:rotate(360deg)}}
.login-pill{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);text-decoration:none}
.login-pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.skeleton{background:linear-gradient(90deg,#202020 25%,#303030 50%,#202020 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sidebar-skeleton{padding:6px 0}
.skeleton-nav{height:10px;width:55px;margin:14px 8px 12px;border-radius:6px}
.skeleton-item{display:flex;align-items:center;gap:8px;padding:12px 10px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.03)}
.skeleton-line{height:13px;flex:1;max-width:75%}

.sidebar{width:264px;min-width:264px;margin:12px 0 12px 12px;height:calc(100dvh - 24px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;z-index:40;background:linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.05) 100%);backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 46px rgba(0,0,0,.6)}
.sidebar-inner{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.sidebar-top{padding:12px;border-bottom:1px solid rgba(255,255,255,.12);flex-shrink:0}
.logo-area{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:12px;height:52px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.brand-logo{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;transition:opacity .2s}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-name{font-weight:800;font-size:15px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transition:opacity .2s}
.sidebar-search-input{position:absolute;left:6px;right:44px;top:50%;transform:translateY(-50%);height:34px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--text-primary);font-size:13px;outline:none;opacity:0;pointer-events:none;transition:opacity .2s}
.sidebar-search-input:focus{border-color:var(--accent)}
.logo-area.search-mode .brand-logo,.logo-area.search-mode .brand-name{opacity:0;pointer-events:none}
.logo-area.search-mode .sidebar-search-input{opacity:1;pointer-events:auto}
.icon-btn{color:var(--text-secondary);padding:8px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:none;cursor:pointer;border:none}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#closeSidebarBtn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
#closeSidebarBtn.clear-mode{color:var(--accent)}
.sidebar-quick-actions{display:flex;align-items:center;justify-content:space-around;gap:4px;padding:8px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
.sidebar-quick-actions.hidden{display:none}
.qaction{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;padding:0;text-decoration:none;font-family:inherit}
.qaction svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qaction.new-chat-icon{color:var(--accent)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:10px 10px 14px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--text-dim);padding:10px 6px 6px 8px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.nav-label-text{flex-shrink:0}
.nav-label-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent)}
.nav-label.hide-by-search{display:none}
.history-item{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 8px;border-radius:12px;color:var(--text-secondary);font-size:13px;cursor:pointer;width:100%;text-align:left;margin-bottom:2px;border:1px solid transparent;position:relative}
.history-item:hover{color:var(--text-primary);background:rgba(255,255,255,.1)}
.history-item.active{color:var(--text-primary);background:rgba(0,122,255,.15);border-color:rgba(255,255,255,.2)}
.history-item.hide-by-search{display:none}
.history-item-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 0;pointer-events:none}
.history-item-pin-icon{color:var(--accent);width:12px;height:12px;flex-shrink:0}
.history-item-pin-icon svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2}
.history-item.renaming{background:rgba(0,122,255,.12);border-color:var(--accent);cursor:text}
.history-rename-input{flex:1;min-width:0;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid var(--accent);color:var(--text-primary);font-size:13px;font-family:inherit;outline:none}
.history-more-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);background:transparent;border:none;cursor:pointer;padding:0;flex-shrink:0}
.history-more-btn svg{width:16px;height:16px;fill:currentColor}
.sidebar-search-empty{display:none;padding:24px 16px;text-align:center;color:var(--text-tertiary);font-size:12.5px}
.sidebar-search-empty.show{display:block}
.sidebar-empty{padding:24px 16px;text-align:center}
.sidebar-empty-icon{width:48px;height:48px;margin:0 auto 12px;border-radius:14px;background:rgba(255,255,255,.06);display:grid;place-items:center;color:var(--text-tertiary)}
.sidebar-empty-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sidebar-empty-text{font-size:12.5px;color:var(--text-tertiary);line-height:1.5;margin-bottom:14px}
.sidebar-empty-cta{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border:1px solid rgba(255,255,255,.22);cursor:pointer}
.sidebar-footer{padding:12px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:10px}
.account-card{padding:10px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.account-row{display:flex;align-items:center;gap:8px}
.account-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dark));display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center}
.account-avatar.has-photo{background-image:var(--avatar-url,none);background-color:transparent;font-size:0}
.account-avatar.guest{background:linear-gradient(135deg,#6b7280,#4b5563)}
.account-info{min-width:0;flex:1;overflow:hidden}
.account-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-actions-side{display:flex;align-items:center;gap:4px;flex-shrink:0}
.account-gear,.account-logout{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;padding:0;text-decoration:none;background:transparent;border:none}
.account-gear{color:var(--text-secondary)}
.account-logout{color:#ff5f57}
.account-gear svg,.account-logout svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.social-box{padding:8px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:space-around;gap:4px}
.social-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);text-decoration:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:17px}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;padding-top:72px;min-height:0}

#landing-view{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
#landing-view.hidden{display:none !important}

.landing-content{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:50px 20px 30px;
  width:100%;
  text-align:center;
  display:block;
}
.landing-inner{
  width:100%;
  max-width:780px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.landing-inner > *{flex-shrink:0}

.workspace-kicker{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:7px 14px;border-radius:999px;color:var(--accent);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.workspace-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.hero-title{font-size:clamp(22px,6vw,40px);font-weight:800;line-height:1.2;letter-spacing:-1px;margin:0 0 16px;color:var(--text-primary);display:block;word-break:break-word;width:100%}
.hero-title .caret{display:inline-block;width:3px;height:.9em;background:var(--accent);margin-left:3px;vertical-align:-.05em;animation:caretBlink .9s steps(2) infinite}
@keyframes caretBlink{0%,50%{opacity:1}51%,100%{opacity:0}}
.workspace-subtitle{color:var(--text-secondary);margin:0 0 24px;font-size:14px;line-height:1.65;max-width:620px}
.quick-actions{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;width:100%;max-width:780px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:145px;min-width:145px;max-width:145px;height:44px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-primary);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);font-family:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;flex-shrink:0}
.chip:hover{background:rgba(255,255,255,.16)}
.chip svg{width:14px;height:14px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:2;flex-shrink:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frequent-section{display:flex;flex-direction:column;align-items:center;width:100%;max-width:780px;margin-top:22px;gap:12px}
.frequent-section.hidden{display:none}
.frequent-label{display:flex;align-items:center;justify-content:center;gap:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);width:100%;max-width:340px}
.frequent-label::before,.frequent-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18))}
.frequent-label::after{background:linear-gradient(90deg,rgba(255,255,255,.18),transparent)}

.landing-input-area{padding:12px 16px 18px;flex-shrink:0;position:relative;width:100%}
.landing-input-area .input-box{max-width:820px;margin:0 auto}

.input-box{width:100%;padding:12px 14px 10px;border-radius:24px;display:flex;flex-direction:column;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.20);position:relative}
.input-box textarea{width:100%;background:transparent;border:none;color:var(--text-primary);font-size:15px;resize:none;min-height:44px;max-height:140px;outline:none;line-height:1.5;padding:4px 4px 0;font-family:inherit}
.input-box textarea::placeholder{color:var(--text-tertiary)}
.pending-preview{display:none;margin-bottom:10px;position:relative}
.pending-preview.show{display:block}
.pending-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pending-cell{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:rgba(0,122,255,.14);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;flex-shrink:0}
.pending-cell.is-img{padding:0}
.pending-cell-img{width:100%;height:100%;object-fit:cover;display:block}
.pending-cell-icon{color:var(--accent);width:20px;height:20px;margin-bottom:2px}
.pending-cell-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2}
.pending-cell-name{font-size:7.5px;color:var(--text-secondary);text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.pending-cell-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;z-index:2}
.pending-cell-remove svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round}
.input-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.input-tools{display:flex;gap:10px;align-items:center;position:relative;flex-wrap:wrap}
.attach-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;padding:0;flex-shrink:0}
.attach-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.attach-menu{position:absolute;bottom:calc(100% + 12px);left:0;min-width:200px;padding:6px;border-radius:18px;background:rgba(38,42,55,.98);border:1px solid rgba(255,255,255,.16);box-shadow:0 16px 48px rgba(0,0,0,.75);opacity:0;transform:translateY(12px) scale(.92);transform-origin:bottom left;pointer-events:none;transition:opacity .28s,transform .36s;z-index:100;overflow:hidden}
:root[data-theme="light"] .attach-menu{background:rgba(255,255,255,.98)}
.attach-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.attach-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--text-primary);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;border:none;text-align:left}
.attach-item:hover{background:rgba(255,255,255,.1)}
.attach-item-icon{width:22px;height:22px;color:var(--accent)}
.attach-item-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.attach-item-icon.support{color:#ff9500}
.attach-item-text{flex:1;font-size:13.5px;font-weight:600}
.send-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);cursor:pointer;padding:0;flex-shrink:0}
.send-btn:disabled{background:rgba(255,255,255,.1);color:var(--text-dim);cursor:not-allowed}
.send-btn svg{width:16px;height:16px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round}

.model-btn{height:32px;padding:0 10px;border-radius:16px;display:flex;align-items:center;gap:6px;color:var(--text-secondary);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;flex-shrink:0;max-width:150px}
.model-btn-icon{font-size:15px;flex-shrink:0}
.model-btn-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.model-btn-caret{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.5;flex-shrink:0}

.scroll-bottom-btn{position:absolute;bottom:100%;right:16px;margin-bottom:12px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(38,42,55,.98);border:1px solid rgba(255,255,255,.20);color:var(--accent);cursor:pointer;padding:0;opacity:0;pointer-events:none;transform:translateY(8px) scale(.9);transition:opacity .25s,transform .3s;z-index:20}
.scroll-bottom-btn.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.scroll-bottom-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}

#chat-view{flex:1;flex-direction:column;overflow:hidden;display:none;min-height:0}
#chat-view.active{display:flex}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;min-height:0}
.msg-container{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.msg.ai{justify-content:flex-start}
.msg-bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user .msg-bubble{background:linear-gradient(135deg,#0a84ff,#0066d6);color:#fff;border:1px solid rgba(255,255,255,.45);border-bottom-right-radius:6px}
.msg.ai .msg-bubble{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--text-primary);border-bottom-left-radius:6px}
.msg.file-only.user .msg-bubble,.msg.file-only.ai .msg-bubble{background:transparent;border:none;padding:0}
.msg-image{max-width:100%;max-height:360px;border-radius:14px;display:block;object-fit:cover;cursor:zoom-in}
.msg-attach-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;max-width:100%}
.msg-attach-cell{position:relative;flex-shrink:0;width:140px;height:140px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.msg-attach-cell-img{width:100%;height:100%;object-fit:cover;display:block}
.msg-attach-cell-file{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:10px;gap:6px;text-align:center}
.msg-attach-cell-file svg{width:34px;height:34px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:1.7}
.msg-attach-cell-filename{font-size:10.5px;font-weight:700;line-height:1.15;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg-attach-cell-filesize{font-size:9.5px;opacity:.65}
.ai-thinking{display:inline-flex;align-items:center;gap:10px;padding:4px 6px}
.ai-thinking img{width:26px;height:26px;object-fit:contain;border-radius:50%}
.ai-thinking-text{font-size:13px;color:var(--text-secondary);font-weight:600}
.ai-thinking-dots{display:inline-flex;gap:3px}
.ai-thinking-dots span{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.4;animation:typingBounce 1.4s ease-in-out infinite}
.ai-thinking-dots span:nth-child(2){animation-delay:.2s}
.ai-thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.chat-input-area{padding:12px 16px 18px;flex-shrink:0;position:relative}
.chat-input-area .input-box{max-width:820px;margin:0 auto}

.lightbox{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:#000}
.lightbox.show{display:flex}
.lightbox img{width:100vw;height:100vh;object-fit:contain;display:block}
.lightbox-toolbar{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:2}
.lightbox-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.lightbox-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

.context-overlay{position:fixed;inset:0;z-index:1400;display:none}
.context-overlay.show{display:block}
.context-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.1)}
.context-menu{position:fixed;min-width:200px;max-width:240px;padding:6px;border-radius:18px;background:rgba(38,42,55,.98);border:1px solid rgba(255,255,255,.16);transform-origin:top right;transform:scale(.85);opacity:0;pointer-events:none;transition:transform .28s,opacity .2s;z-index:1}
.context-overlay.show .context-menu{transform:scale(1);opacity:1;pointer-events:auto}
.context-title{padding:8px 14px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:4px}
.context-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--text-primary);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;border:none;text-align:left}
.context-item svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;color:var(--accent)}
.context-item.danger{color:#ff5f57}
.context-item.danger svg{color:#ff5f57}

    ov.classList.add('show');
  }
});
window.addEventListener('unhandledrejection', function(e){
  var ov = document.getElementById('errorOverlay');
  var txt = document.getElementById('errorText');
  if (ov && txt) {
    txt.textContent = 'Unhandled Promise Rejection:\n' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '\n\nStack:\n' + (e.reason && e.reason.stack ? e.reason.stack : '(no stack)');
    ov.classList.add('show');
  }
});

function filterHistory(query) {
  var q = (query || '').trim().toLowerCase();
  var items = historyList.querySelectorAll('.history-item');
  var visibleCount = 0;
  for (var i = 0; i < items.length; i++) {
    var btn = items[i];
    var textEl = btn.querySelector('.history-item-text');
    var text = textEl ? textEl.textContent : '';
    if (!q || text.toLowerCase().indexOf(q) !== -1) { btn.classList.remove('hide-by-search'); visibleCount++; }
    else btn.classList.add('hide-by-search');
  }
  var labels = historyList.querySelectorAll('.nav-label');
  for (var j = 0; j < labels.length; j++) {
    var lbl = labels[j];
    var hasVisible = false, sib = lbl.nextElementSibling;
    while (sib && !sib.classList.contains('nav-label')) {
      if (sib.classList.contains('history-item') && !sib.classList.contains('hide-by-search')) { hasVisible = true; break; }
      sib = sib.nextElementSibling;
    }
    if (hasVisible) lbl.classList.remove('hide-by-search'); else lbl.classList.add('hide-by-search');
  }
  var emptyEl = document.getElementById('sidebarSearchEmpty');
  if (emptyEl) {
    if (q && visibleCount === 0) emptyEl.classList.add('show');
    else emptyEl.classList.remove('show');
  }
}

function subscribeMessages(uid, chatId) {
  if (state.unsubMessages) { state.unsubMessages(); state.unsubMessages = null; }
  if (!chatId) return;
  var q = query(collection(db, 'users', uid, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'));
  state.unsubMessages = onSnapshot(q, function(snap){
    var chat = state.chats.find(function(c){ return c.id === chatId; });
    if (!chat) return;
    var remoteMsgs = [];
    snap.forEach(function(d){
      var data = d.data() || {};
      remoteMsgs.push({ role: data.role, text: data.text || '', files: data.files || (data.file ? [data.file] : []) });
    });
    if (remoteMsgs.length > chat.messages.length) {
      for (var i = 0; i < chat.messages.length && i < remoteMsgs.length; i++) {
        var local = chat.messages[i], remote = remoteMsgs[i];
        if (local.files && remote.files && local.files.length === remote.files.length) {
          remote.files = remote.files.map(function(rf, idx){
            var lf = local.files[idx];
            if (lf && lf.dataUrl && !rf.dataUrl) rf.dataUrl = lf.dataUrl;
            return rf;
          });
        }
      }
      chat.messages = remoteMsgs;
      if (state.activeChatId === chatId) renderMessages();
      renderFrequentChips();
    }
  }, function(err){ console.warn('subscribeMessages', err); });
}

function generateShortTitle(text) {
  if (!text) return 'New chat';
  var words = text.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length > 2 && !STOP_WORDS.has(w); });
  if (words.length === 0) { var fb = text.trim().slice(0, 25); return fb + (text.length > 25 ? '...' : ''); }
  var title = words.slice(0, 3).join(' ');
  if (title.length > 28) title = title.slice(0, 28).trim();
  return title.charAt(0).toUpperCase() + title.slice(1);
}

function extractFrequentKeywords() {
  if (!state.chats || state.chats.length === 0) return [];
  var counter = {};
  function addWords(text, weight) {
    if (!text) return;
    var words = text.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(function(w){ return w.length > 3 && !STOP_WORDS.has(w) && !/^\d+$/.test(w); });
    var uniq = {}; words.forEach(function(w){ uniq[w] = 1; });
    Object.keys(uniq).forEach(function(w){ counter[w] = (counter[w] || 0) + weight; });
  }
  state.chats.forEach(function(chat){
    addWords(chat.title || '', 3);
    (chat.messages || []).forEach(function(msg){ if (msg.role === 'user') addWords(msg.text || '', 1); });
  });
  var arr = Object.keys(counter).map(function(k){ return [k, counter[k]]; });
  arr = arr.filter(function(x){ return x[1] >= 2; });
  arr.sort(function(a, b){ return b[1] - a[1]; });
  return arr.slice(0, 2).map(function(x){ return x[0]; });
}

function getDateLabel(ms) {

  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  var yest = today - 86400000;
  if (ms >= today) return 'Hari Ini';
  if (ms >= yest) return 'Kemarin';
  var d = new Date(ms);
  return d.getDate() + ' ' + INDO_MONTHS[d.getMonth()] + ' ' + d.getFullYear();
}

function groupChatsByDate() {

    if (!dateGroups[label]) { dateGroups[label] = []; order.push(label); }

function openContextMenu(chatId, chatTitle, anchorEl) {

  contextOverlay.classList.add('show');
  requestAnimationFrame(function(){
    var rect = anchorEl.getBoundingClientRect();
    var menuRect = contextMenu.getBoundingClientRect();
    var padding = 10, gap = 6;
    var left = rect.right - menuRect.width;
    var top = rect.bottom + gap;
    if (top + menuRect.height > window.innerHeight - padding) top = rect.top - menuRect.height - gap;
    if (left < padding) left = padding;
    if (left + menuRect.width > window.innerWidth - padding) left = window.innerWidth - menuRect.width - padding;
    if (top < padding) top = rect.bottom + gap;
    contextMenu.style.left = left + 'px';
    contextMenu.style.top = top + 'px';
  });
}

async function togglePin() {
  if (!state.user || !state.ctxChatId) return;
  var chat = state.chats.find(function(c){ return c.id === state.ctxChatId; });
  if (!chat) return;
  var newVal = !chat.isPinned;
  try { await updateDoc(doc(db, 'users', state.user.uid, 'chats', state.ctxChatId), { isPinned: newVal }); chat.isPinned = newVal; showToast(newVal ? 'Chat disematkan' : 'Sematan dilepas'); }
  catch (e) { showToast('Gagal menyematkan'); }
}
async function deleteChat() {
  if (!state.user || !state.ctxChatId) return;
  var chat = state.chats.find(function(c){ return c.id === state.ctxChatId; });
  if (!chat) return;
  var ok = confirm('Hapus chat "' + chat.title + '"?');
  if (!ok) return;
  try {
    await deleteDoc(doc(db, 'users', state.user.uid, 'chats', state.ctxChatId));
    if (state.activeChatId === state.ctxChatId) { state.activeChatId = null; showLandingView(); chatMessages.innerHTML = ''; }
    state.chats = state.chats.filter(function(c){ return c.id !== state.ctxChatId; });
    renderHistory(); showToast('Chat dihapus');
  } catch (e) { showToast('Gagal menghapus chat'); }
}

if (ctxRename) ctxRename.addEventListener('click', function(e){ e.stopPropagation(); var id = state.ctxChatId; closeContextMenu(); setTimeout(function(){ startRenameInline(id); }, 180); });

function showLandingView() { state.mode = 'landing'; landingView.classList.remove('hidden'); chatView.classList.remove('active'); updateHeaderTitle(); renderFrequentChips(); }
function showChatView() { state.mode = 'chat'; landingView.classList.add('hidden'); chatView.classList.add('active'); updateHeaderTitle(); }

function scrollToBottom(force) { if (!force && state.userScrolledUp) return; chatMessages.scrollTop = chatMessages.scrollHeight; }
function checkScrollPos() {
  var btn = $('chatScrollBottomBtn');
  if (!btn) return;
  var dist = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
  var atBottom = dist < 40;
  if (state.userScrolledUp && !atBottom) btn.classList.add('show');
  else { btn.classList.remove('show'); if (atBottom) state.userScrolledUp = false; }
}
chatMessages.addEventListener('scroll', function(){ setTimeout(checkScrollPos, 80); }, { passive: true });

function buildBubbleContent(bubble, m) {
  var hasText = m.text && m.text.trim();
  var files = m.files || (m.file ? [m.file] : []);
  if (files.length) {
    if (files.length > 1) {
      var strip = document.createElement('div');
      strip.className = 'msg-attach-strip';
      files.forEach(function(f){
        var cell = document.createElement('div');
        var isImage = f.dataUrl && f.type && f.type.indexOf('image/') === 0;
        cell.className = 'msg-attach-cell' + (isImage ? ' is-img' : '');
        if (isImage) {
          var im = document.createElement('img');
          im.src = f.dataUrl; im.className = 'msg-attach-cell-img'; im.alt = f.name || '';
          im.addEventListener('click', function(){ openLightbox(f.dataUrl, f.name); });
          cell.appendChild(im);
        } else {
          var inner = document.createElement('div');
          inner.className = 'msg-attach-cell-file';
          var sizeKB = f.size ? (f.size / 1024).toFixed(1) + ' KB' : '';
          inner.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="msg-attach-cell-filename">' + (f.name || 'file') + '</div>' + (sizeKB ? '<div class="msg-attach-cell-filesize">' + sizeKB + '</div>' : '');
          cell.appendChild(inner);
        }
        strip.appendChild(cell);
      });
      bubble.appendChild(strip);
    } else {
      var f1 = files[0];
      var isImage1 = f1.dataUrl && f1.type && f1.type.indexOf('image/') === 0;
      if (isImage1) {
        var img = document.createElement('img');
        img.src = f1.dataUrl; img.className = 'msg-image'; img.alt = f1.name || '';
        img.addEventListener('click', function(){ openLightbox(f1.dataUrl, f1.name); });
        bubble.appendChild(img);
      } else {
        var card = document.createElement('div');
        card.className = 'msg-file';
        var sizeKB1 = f1.size ? (f1.size / 1024).toFixed(1) + ' KB' : '';
        card.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="msg-file-info"><div class="msg-file-name">' + (f1.name || 'file') + '</div>' + (sizeKB1 ? '<div class="msg-file-size">' + sizeKB1 + '</div>' : '') + '</div>';
        bubble.appendChild(card);
      }
    }
    if (hasText) { var cap = document.createElement('div'); cap.className = 'msg-caption'; cap.textContent = m.text; bubble.appendChild(cap); }
    return 'file-only';
  }
  bubble.textContent = m.text || '';
  return 'text';
}

function renderMessages() {
  var chat = getActiveChat();
  chatMessages.innerHTML = '';
  if (!chat) { showLandingView(); return; }
  if (!chat.messages || !chat.messages.length) { updateHeaderTitle(); return; }
  var container = document.createElement('div'); container.className = 'msg-container';
  chat.messages.forEach(function(m){
    var msg = document.createElement('div'); msg.className = 'msg ' + m.role;
    var bubble = document.createElement('div'); bubble.className = 'msg-bubble';
    var kind = buildBubbleContent(bubble, m);
    if (kind === 'file-only') msg.classList.add('file-only');
    msg.appendChild(bubble); container.appendChild(msg);
  });
  chatMessages.appendChild(container);
  scrollToBottom(true);
  updateHeaderTitle();
}

function createTypingIndicator() {
  var msg = document.createElement('div');
  msg.className = 'msg ai'; msg.id = 'typingIndicator';

  bubble.innerHTML = '<div class="ai-thinking"><img src="favicon.png" alt="" onerror="this.style.display=\'none\'"><span class="ai-thinking-text">Brain Side sedang berpikir</span><span class="ai-thinking-dots"><span></span><span></span><span></span></span></div>';
  msg.appendChild(bubble);
  return msg;
}

function renderPendingPreview() {
  var isLanding = state.mode === 'landing';
  var previewEl = isLanding ? $('landingPendingPreview') : $('chatPendingPreview');
  var stripEl = isLanding ? $('landingPreviewStrip') : $('chatPreviewStrip');
  var other = isLanding ? $('chatPendingPreview') : $('landingPendingPreview');
  if (other) other.classList.remove('show');
  if (!state.pendingFiles.length) { previewEl.classList.remove('show'); return; }
  stripEl.innerHTML = '';
  state.pendingFiles.forEach(function(item, idx){
    var cell = document.createElement('div');
    cell.className = 'pending-cell' + (item.dataUrl ? ' is-img' : '');
    if (item.dataUrl) {
      var img = document.createElement('img'); img.src = item.dataUrl; img.className = 'pending-cell-img'; img.alt = item.name;
      cell.appendChild(img);
    } else {
      var icon = document.createElement('div'); icon.className = 'pending-cell-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      cell.appendChild(icon);
      var nm = document.createElement('div'); nm.className = 'pending-cell-name'; nm.textContent = item.name;
      cell.appendChild(nm);
    }
    var rm = document.createElement('button');
    rm.className = 'pending-cell-remove'; rm.type = 'button';
    rm.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    rm.addEventListener('click', function(e){ e.stopPropagation(); state.pendingFiles.splice(idx, 1); renderPendingPreview(); updateSendBtns(); });
    cell.appendChild(rm);
    stripEl.appendChild(cell);
  });
  previewEl.classList.add('show');
}

async function handleSend(text) {
  if (state.isStreaming) return;
  text = (text || '').trim();
  if (!text && !state.pendingFiles.length) return;
  if (requireLogin()) return;

  var filesSnapshot = state.pendingFiles.map(function(f){ return { name: f.name, type: f.type, size: f.size, dataUrl: f.dataUrl }; });
  state.pendingFiles = [];
  renderPendingPreview();

  var chatId = state.activeChatId;
  var chat = chatId ? state.chats.find(function(c){ return c.id === chatId; }) : null;
  if (!chatId || !chat) {
    chatId = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    var title = text ? generateShortTitle(text) : (filesSnapshot.length ? filesSnapshot[0].name : 'New chat');
    chat = { id: chatId, title: title, createdAt: Date.now(), isPinned: false, messages: [], isLocal: false };
    state.chats.unshift(chat); state.activeChatId = chatId;
    if (state.user) { try { await setDoc(doc(db, 'users', state.user.uid, 'chats', chatId), { title: title, createdAt: new Date(), isPinned: false }); } catch (e) { chat.isLocal = true; } }
    else chat.isLocal = true;
    renderHistory();
  }

  var userMsg = { role: 'user', text: text || '' };
  if (filesSnapshot.length) userMsg.files = filesSnapshot;
  chat.messages.push(userMsg);

  landingInput.value = ''; chatInput.value = '';
  landingInput.style.height = 'auto'; chatInput.style.height = 'auto';
  updateSendBtns();
  showChatView();
  state.userScrolledUp = false;
  renderMessages();

  if (state.user && !chat.isLocal) { pushMessageRemote(chatId, 'user', text || '', filesSnapshot); subscribeMessages(state.user.uid, chatId); }

  state.isStreaming = true;
  updateSendBtns();

  setTimeout(function(){
    var c = chatMessages.querySelector('.msg-container');
    if (c && !document.getElementById('typingIndicator')) c.appendChild(createTypingIndicator());
    scrollToBottom();
  }, 100);

  var reply;
  try {
    var fileNames = filesSnapshot.map(function(f){ return f.name; }).join(', ');
    var aiText = text || (fileNames ? '[' + fileNames + ']' : '');
    var convId = getAIConvId(chatId);
    var result = await askSpicy(aiText, convId);
    reply = result.reply;
    if (result.conversationId) setAIConvId(chatId, result.conversationId);
  } catch (err) { reply = 'AI error: ' + (err.message || 'Unknown error'); }

  var typingEl = document.getElementById('typingIndicator');
  safeRemove(typingEl);

  var container = chatMessages.querySelector('.msg-container');
  var aiBubbleEl = null;
  if (container) {
    var aiMsg = document.createElement('div'); aiMsg.className = 'msg ai';
    aiBubbleEl = document.createElement('div'); aiBubbleEl.className = 'msg-bubble';
    aiMsg.appendChild(aiBubbleEl); container.appendChild(aiMsg);
    scrollToBottom();
  }
  var i = 0;
  while (i < reply.length) {
    i += 2;
    if (aiBubbleEl) aiBubbleEl.textContent = reply.slice(0, i);
    if (!state.userScrolledUp) chatMessages.scrollTop = chatMessages.scrollHeight;
    await new Promise(function(r){ return setTimeout(r, 16); });
  }
  if (!state.userScrolledUp) scrollToBottom(true);
  checkScrollPos();

  chat.messages.push({ role: 'ai', text: reply });
  if (state.user && !chat.isLocal) pushMessageRemote(chatId, 'ai', reply, null);
  state.isStreaming = false;
  updateSendBtns();
  checkScrollPos();
}

function updateSendBtns() {
  var lHas = landingInput.value.trim().length > 0 || state.pendingFiles.length > 0;
  var cHas = chatInput.value.trim().length > 0 || state.pendingFiles.length > 0;
  landingSend.disabled = !lHas || state.isStreaming;
  chatSend.disabled = !cHas || state.isStreaming;
}
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
[landingInput, chatInput].forEach(function(el){

  el.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(el.value); } });
});
landingSend.addEventListener('click', function(){ handleSend(landingInput.value); });
chatSend.addEventListener('click', function(){ handleSend(chatInput.value); });

}

function setupAttachMenu(btnId, menuId) {
  var btn = $(btnId); var menu = $(menuId);
  if (!btn || !menu) return;
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    var all = document.querySelectorAll('.attach-menu.show');
    for (var i = 0; i < all.length; i++) { if (all[i] !== menu) all[i].classList.remove('show'); }
    menu.classList.toggle('show');
  });
  var supports = menu.querySelectorAll('.attach-item[data-attach="support"]');
  for (var i = 0; i < supports.length; i++) {
    supports[i].addEventListener('click', function(e){ e.stopPropagation(); menu.classList.remove('show'); showToast('Support Me - coming soon'); });
  }
  var fileItems = menu.querySelectorAll('.attach-item[data-attach="image"], .attach-item[data-attach="file"]');
  for (var j = 0; j < fileItems.length; j++) {
    fileItems[j].addEventListener('click', function(){ menu.classList.remove('show'); });
  }
}

setupAttachMenu('chatAttachBtn', 'chatAttachMenu');

});

function addSelectedFiles(fileList) {
  var picked = Array.prototype.slice.call(fileList || []);
  if (!picked.length) return;
  var slots = MAX_FILES - state.pendingFiles.length;
  if (slots <= 0) { showToast('Maksimal ' + MAX_FILES + ' file'); return; }
  var use = picked.slice(0, slots);
  use.forEach(function(file) {
    var item = { name: file.name || 'file', type: file.type || 'application/octet-stream', size: file.size || 0, dataUrl: null };
    state.pendingFiles.push(item);
    if (item.type.indexOf('image/') === 0) {
      var reader = new FileReader();
      reader.onload = function(e) { item.dataUrl = e.target && e.target.result ? e.target.result : null; renderPendingPreview(); updateSendBtns(); };
      reader.onerror = function() { renderPendingPreview(); updateSendBtns(); };
      reader.readAsDataURL(file);
    }
  });
  renderPendingPreview();
  updateSendBtns();
}

['landingImagePicker','landingFilePicker','chatImagePicker','chatFilePicker'].forEach(function(id){
  var input = $(id);
  if (!input) return;
  input.addEventListener('change', function(){ addSelectedFiles(this.files); this.value = ''; });
});

function doNewChat() {
  if (requireLogin()) return;
  state.activeChatId = null;
  state.userScrolledUp = false;
  if (state.unsubMessages) { state.unsubMessages(); state.unsubMessages = null; }
  state.pendingFiles = [];
  renderPendingPreview();
  renderHistory();
  showLandingView();
  chatMessages.innerHTML = '';
  updateHeaderTitle();
  if (window.innerWidth <= 768) closeSidebarFn();
}

var PHRASES = ['Halo, ada yang bisa dibantu?','Mau ngobrol santai atau coding?','Butuh bikin fungsi, script, atau bug fix?','Generate caption, ide, atau kode?','Tanya apa aja - gw bantu pikirin.','Dari ngobrol sampai bikin sesuatu.','Satu tempat buat chat, code, generate.'];
(function typewriter() {
  var el = document.getElementById('typedText');
  if (!el) return;
  try {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { el.textContent = PHRASES[0]; return; }
  } catch (_) {}
  var TYPE_SPEED = 55, ERASE_SPEED = 22, HOLD_MS = 1800;
  var pi = 0;
  function sleep(ms) { return new Promise(function(r){ return setTimeout(r, ms); }); }
  async function type(text) { for (var i = 1; i <= text.length; i++) { el.textContent = text.slice(0, i); await sleep(TYPE_SPEED + Math.random() * 20); } }
  async function erase() { while (el.textContent.length) { el.textContent = el.textContent.slice(0, -1); await sleep(ERASE_SPEED); } }
  (async function loop() {
    await sleep(1400);
    el.textContent = '';
    await sleep(200);
    for (;;) { var phrase = PHRASES[pi % PHRASES.length]; await type(phrase); await sleep(HOLD_MS); await erase(); await sleep(220); pi++; }
  })();
})();

onAuthStateChanged(auth, async function(user){
  if (state.unsubChats) { state.unsubChats(); state.unsubChats = null; }
  if (state.unsubMessages) { state.unsubMessages(); state.unsubMessages = null; }
  state.user = user;
  if (!user) {
    state.chats = []; state.activeChatId = null; state.chatsLoaded = true;
    if (userNameEl) userNameEl.textContent = 'Guest';
    if (userEmailEl) userEmailEl.textContent = 'Belum login';
    if (userAvatar) { userAvatar.classList.add('guest'); userAvatar.classList.remove('has-photo'); userAvatar.style.removeProperty('--avatar-url'); userAvatar.textContent = '?'; }
    if (accountActionsSide) accountActionsSide.style.display = 'none';
    markAuthReady();
    return;
  }
  var email = user.email || '';
  var initialName = email.split('@')[0] || 'User';
  state.chatsLoaded = false;
  if (userNameEl) userNameEl.textContent = initialName;
  if (userEmailEl) userEmailEl.textContent = email;
  if (userAvatar) {
    userAvatar.classList.remove('guest');
    if (user.photoURL) { userAvatar.classList.add('has-photo'); userAvatar.style.setProperty('--avatar-url', 'url("' + user.photoURL + '")'); userAvatar.textContent = ''; }
    else { userAvatar.classList.remove('has-photo'); userAvatar.style.removeProperty('--avatar-url'); userAvatar.textContent = (initialName[0] || '?').toUpperCase(); }
  }
  if (accountActionsSide) accountActionsSide.style.display = 'flex';
  markAuthReady();
  subscribeChats(user.uid);
  try {
    var snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      var data = snap.data();
      var displayName = data.username || initialName;
      var photoBase64 = data.photoBase64 || user.photoURL || null;
      if (userNameEl) userNameEl.textContent = displayName;
      if (userAvatar) {
        if (photoBase64) { userAvatar.classList.add('has-photo'); userAvatar.style.setProperty('--avatar-url', 'url("' + photoBase64 + '")'); userAvatar.textContent = ''; }
        else { userAvatar.classList.remove('has-photo'); userAvatar.style.removeProperty('--avatar-url'); userAvatar.textContent = (displayName[0] || '?').toUpperCase(); }
      }
      try { sessionStorage.setItem('bs_user_cache', JSON.stringify({ uid: user.uid, email: email, username: displayName, photoBase64: photoBase64 })); } catch (_) {}
    }
  } catch (e) { console.warn('getDoc', e); }
});
