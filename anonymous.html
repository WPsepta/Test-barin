<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05030d">
<title>Anonymous — Brain Side</title>
<link rel="stylesheet" href="glass.css?v=3">
<script src="theme.js"></script>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%}
body{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:1;
}

.profile-topbar{position:fixed;top:0;left:0;right:0;z-index:999;height:52px;margin:10px 14px 0;padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.06) 100%);backdrop-filter:blur(28px) saturate(200%) brightness(1.08);-webkit-backdrop-filter:blur(28px) saturate(200%) brightness(1.08);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(255,255,255,.06),0 8px 28px rgba(0,0,0,.35)}
:root[data-theme="light"] .profile-topbar{background:linear-gradient(135deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.55) 100%);border-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 1px rgba(255,255,255,1),inset 0 -1px 1px rgba(255,255,255,.5),0 8px 28px rgba(30,45,80,.12)}
.profile-topbar-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:800;letter-spacing:-.01em;color:var(--text-primary);pointer-events:none;white-space:nowrap}
.back-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-primary);background:transparent;border:none;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.4,.5,1),color .2s;flex-shrink:0;padding:0;text-decoration:none;-webkit-tap-highlight-color:transparent}
.back-btn:hover{transform:scale(1.12);color:var(--accent)}
.back-btn:active{transform:scale(.92)}
.back-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.anon-mask-badge{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:transparent;filter:drop-shadow(0 0 6px var(--accent-glow));flex-shrink:0}
.anon-mask-badge svg{width:24px;height:24px;fill:currentColor;stroke:none;display:block}

.anon-main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  min-height:0;
  padding-top:72px;
  position:relative;
  z-index:1;
}
.chat-messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:12px 16px 12px;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
}

.welcome{max-width:620px;margin:0 auto;padding:40px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.welcome-mask{width:84px;height:84px;display:grid;place-items:center;color:var(--accent);margin-bottom:8px;filter:drop-shadow(0 0 20px var(--accent-glow));animation:maskFloat 3s ease-in-out infinite}
@keyframes maskFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.welcome-mask svg{width:100%;height:100%;fill:currentColor;stroke:none;display:block}
.welcome-title{font-size:24px;font-weight:800;color:var(--text-primary)}
.welcome-sub{font-size:13.5px;color:var(--text-secondary);line-height:1.6;max-width:400px}
.welcome-note{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--accent);background:rgba(0,122,255,.1);border:1px solid rgba(0,122,255,.24)}
.welcome-note svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.msg-container{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;animation:msgIn .35s ease both}
.msg.user{justify-content:flex-end}
.msg.ai{justify-content:flex-start}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-bubble{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6;word-wrap:break-word;white-space:pre-wrap}
.msg.user .msg-bubble{background:linear-gradient(135deg,#4b5563,#374151);color:#fff;border:1px solid rgba(255,255,255,.2);border-bottom-right-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.msg.ai .msg-bubble{background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.04) 100%);backdrop-filter:blur(20px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(20px) saturate(190%) brightness(1.06);border:1px solid rgba(255,255,255,.18);color:var(--text-primary);border-bottom-left-radius:6px;box-shadow:inset 0 1px 1px rgba(255,255,255,.24),0 4px 18px rgba(0,0,0,.4)}
.msg.file-only.user .msg-bubble{background:transparent;border:none;box-shadow:none;color:inherit;padding:0}
.msg.file-only.ai .msg-bubble{background:transparent;border:none;box-shadow:none;padding:0}
.msg-image{max-width:100%;max-height:360px;border-radius:14px;display:block;object-fit:cover;cursor:zoom-in;user-select:none}
.msg-file{display:flex;align-items:center;gap:10px;padding:0;min-width:180px}
.msg-file+.msg-file{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.10)}
.msg-file svg{width:26px;height:26px;color:var(--accent);flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg.user .msg-file svg{color:#fff}
.msg-file-info{min-width:0;flex:1}
.msg-file-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit}
.msg-file-size{font-size:11px;opacity:.75;margin-top:2px}
.msg-caption{margin-top:8px;font-size:13.5px;opacity:.95;white-space:pre-wrap;word-wrap:break-word}
.msg-attach-strip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;margin:0 -4px;padding-left:4px;padding-right:4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;max-width:100%}
.msg-attach-strip::-webkit-scrollbar{height:4px}
.msg-attach-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:2px}
.msg-attach-strip::-webkit-scrollbar-track{background:transparent}
:root[data-theme="light"] .msg-attach-strip::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18)}
.msg-attach-cell{position:relative;flex-shrink:0;width:140px;height:140px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;scroll-snap-align:start;transition:transform .25s ease}
.msg-attach-cell:hover{transform:scale(1.03)}
.msg-attach-cell.is-img{padding:0;cursor:zoom-in}
.msg-attach-cell-img{width:100%;height:100%;object-fit:cover;display:block}
.msg-attach-cell-file{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:10px;gap:6px;text-align:center}
.msg-attach-cell-file svg{width:34px;height:34px;color:var(--accent);fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.msg.user .msg-attach-cell-file svg{color:#fff}
.msg-attach-cell-filename{font-size:10.5px;font-weight:700;line-height:1.15;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.msg-attach-cell-filesize{font-size:9.5px;opacity:.65;margin-top:1px}
:root[data-theme="light"] .msg-attach-cell{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.08)}

.ai-thinking{display:inline-flex;align-items:center;gap:10px;padding:4px 6px}
.ai-thinking .ai-mask-icon{width:26px;height:26px;color:var(--accent);filter:drop-shadow(0 0 8px var(--accent-glow));animation:aiThinkPulse 1.4s ease-in-out infinite;flex-shrink:0}
.ai-thinking .ai-mask-icon svg{width:100%;height:100%;fill:currentColor;stroke:none;display:block}
@keyframes aiThinkPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.7}}
.ai-thinking-text{font-size:13px;color:var(--text-secondary);font-weight:600;white-space:nowrap}
.ai-thinking-dots{display:inline-flex;gap:3px;align-items:center}
.ai-thinking-dots span{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.4;animation:typingBounce 1.4s ease-in-out infinite}
.ai-thinking-dots span:nth-child(2){animation-delay:.2s}
.ai-thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

.chat-input-area{
  padding:12px 16px 18px;
  flex-shrink:0;
  position:relative;
  transition:padding-bottom .25s ease;
}
.input-box{
  max-width:820px;
  margin:0 auto;
  width:100%;
  padding:12px 14px 10px;
  border-radius:24px;
  display:flex;
  flex-direction:column;
  background:linear-gradient(135deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.06) 40%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.12) 100%);
  backdrop-filter:blur(32px) saturate(200%) brightness(1.06) contrast(1.05);
  -webkit-backdrop-filter:blur(32px) saturate(200%) brightness(1.06) contrast(1.05);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(255,255,255,.08),inset 0 0 24px rgba(255,255,255,.06),0 12px 40px rgba(0,0,0,.55),0 4px 12px rgba(0,0,0,.35);
  transition:transform .3s ease,box-shadow .3s ease;
  position:relative;
}
.input-box:focus-within{transform:translateY(-1px);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -1px 1px rgba(255,255,255,.1),inset 0 0 24px rgba(255,255,255,.08),0 14px 44px rgba(0,0,0,.6),0 0 0 3px rgba(0,122,255,.18),0 0 32px var(--accent-glow)}
.input-box textarea{width:100%;background:transparent;border:none;color:var(--text-primary);font-size:15px;resize:none;min-height:44px;max-height:140px;outline:none;line-height:1.5;padding:4px 4px 0;font-family:inherit;display:block}
.input-box textarea::placeholder{color:var(--text-tertiary)}

.pending-preview{display:none;margin-bottom:10px;position:relative}
.pending-preview.show{display:block}
.pending-strip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.pending-strip::-webkit-scrollbar{height:4px}
.pending-strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
.pending-cell{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:rgba(0,122,255,.14);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;flex-shrink:0}
.pending-cell.is-img{padding:0}
.pending-cell-img{width:100%;height:100%;object-fit:cover;display:block}
.pending-cell-icon{color:var(--accent);width:20px;height:20px;display:grid;place-items:center;margin-bottom:2px}
.pending-cell-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pending-cell-name{font-size:7.5px;color:var(--text-secondary);text-align:center;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.pending-cell-remove{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;z-index:2}
.pending-cell-remove svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}

.input-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.input-tools{display:flex;gap:12px;align-items:center;position:relative}
.attach-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);transition:background .2s,color .2s,transform .3s cubic-bezier(.34,1.4,.5,1);font-family:inherit;cursor:pointer;padding:0;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.attach-btn:hover{color:var(--accent);background:rgba(0,122,255,.14);border-color:rgba(0,122,255,.3)}
.attach-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.attach-menu{position:absolute;bottom:calc(100% + 12px);left:0;min-width:200px;padding:6px;border-radius:18px;background:linear-gradient(135deg,rgba(48,52,66,.98) 0%,rgba(38,42,55,.98) 100%);backdrop-filter:blur(40px) saturate(200%) brightness(1.05);-webkit-backdrop-filter:blur(40px) saturate(200%) brightness(1.05);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),inset 0 -1px 1px rgba(255,255,255,.04),0 16px 48px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.5);opacity:0;transform:translateY(12px) scale(.92);transform-origin:bottom left;filter:blur(8px);pointer-events:none;transition:opacity .28s,transform .36s cubic-bezier(.34,1.4,.5,1),filter .32s;z-index:100;overflow:hidden}
:root[data-theme="light"] .attach-menu{background:linear-gradient(135deg,rgba(255,255,255,.98) 0%,rgba(245,248,252,.98) 100%);border-color:rgba(0,0,0,.06)}
.attach-menu.show{opacity:1;transform:translateY(0) scale(1);filter:blur(0);pointer-events:auto}
.attach-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--text-primary);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;border:none;text-align:left;-webkit-tap-highlight-color:transparent}
.attach-item:hover{background:rgba(255,255,255,.1)}
.attach-item-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--accent)}
.attach-item-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.attach-item-icon.support{color:#ff9500}
.attach-item-text{flex:1;min-width:0;font-size:13.5px;font-weight:600}
.send-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px var(--accent-glow);transition:transform .3s,opacity .3s;flex-shrink:0;cursor:pointer;padding:0}
.send-btn:disabled{background:rgba(255,255,255,.1);color:var(--text-dim);border-color:rgba(255,255,255,.16);box-shadow:none;cursor:not-allowed}
.send-btn svg{width:16px;height:16px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

.scroll-bottom-btn{position:absolute;bottom:100%;right:16px;margin-bottom:12px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(48,52,66,.98) 0%,rgba(38,42,55,.98) 100%);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.20);box-shadow:inset 0 1px 1px rgba(255,255,255,.20),0 8px 24px rgba(0,0,0,.5),0 0 20px var(--accent-glow);color:var(--accent);cursor:pointer;padding:0;opacity:0;pointer-events:none;transform:translateY(8px) scale(.9);transition:opacity .25s,transform .3s;z-index:20;-webkit-tap-highlight-color:transparent}
:root[data-theme="light"] .scroll-bottom-btn{background:linear-gradient(135deg,rgba(255,255,255,.98) 0%,rgba(245,248,252,.98) 100%);border-color:rgba(0,0,0,.08)}
.scroll-bottom-btn.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.scroll-bottom-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.input-tools .model-btn{height:32px;padding:0 10px;border-radius:16px;display:flex;align-items:center;gap:6px;color:var(--text-secondary);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;flex-shrink:0;max-width:150px;transition:background .2s,color .2s,transform .3s cubic-bezier(.34,1.4,.5,1);-webkit-tap-highlight-color:transparent}
.input-tools .model-btn:hover{color:var(--accent);background:rgba(0,122,255,.14);border-color:rgba(0,122,255,.3);transform:scale(1.03)}
.input-tools .model-btn:active{transform:scale(.95)}
.input-tools .model-btn .model-btn-icon{font-size:15px;line-height:1;flex-shrink:0}
.input-tools .model-btn .model-btn-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.input-tools .model-btn .model-btn-caret{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;opacity:.7}
@media (max-width:400px){.input-tools .model-btn{max-width:100px;padding:0 8px;font-size:11px}}

.msg-bubble.has-code{padding:12px 14px;white-space:normal}
.msg-text-part{white-space:pre-wrap;word-wrap:break-word;margin:6px 0}
.msg-text-part:first-child{margin-top:0}
.msg-text-part:last-child{margin-bottom:0}
.code-box{margin:10px 0;border-radius:14px;overflow:hidden;background:rgba(10,12,20,.65);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.code-box-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.code-box-title{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#0a84ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.code-box-actions{display:flex;gap:6px}
.code-box-btn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:rgba(255,255,255,.7);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .2s,color .2s;padding:0;-webkit-tap-highlight-color:transparent}
.code-box-btn:hover{color:#0a84ff;background:rgba(10,132,255,.18);border-color:rgba(10,132,255,.4)}
.code-box-btn.copied{color:#34c759;border-color:rgba(52,199,89,.5);background:rgba(52,199,89,.14)}
.code-box-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.code-box-tabs{display:flex;gap:4px;padding:8px 10px 0;overflow-x:auto;scrollbar-width:none}
.code-box-tabs::-webkit-scrollbar{display:none}
.code-tab{padding:5px 12px;font-size:11.5px;font-weight:700;border-radius:8px;color:rgba(255,255,255,.55);background:transparent;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.code-tab:hover{color:#fff;background:rgba(255,255,255,.06)}
.code-tab.active{color:#0a84ff;background:rgba(10,132,255,.18);border-color:rgba(10,132,255,.4)}
.code-box-content{margin:0;padding:12px;font-family:inherit;font-size:12.5px;line-height:1.55;color:#e5e7eb;overflow:auto;max-height:420px;background:transparent;white-space:pre;tab-size:2}
.code-box-content code{display:block;white-space:pre;color:#e5e7eb;font-family:inherit}

.code-preview-modal{position:fixed;inset:0;z-index:2100;display:none;align-items:center;justify-content:center;padding:20px}
.code-preview-modal.show{display:flex}
.code-preview-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.code-preview-window{position:relative;width:min(1000px,100%);height:min(720px,100%);border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.7);display:flex;flex-direction:column}
.code-preview-header{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.95);border-bottom:1px solid rgba(0,0,0,.08);color:#111;font-size:13px;font-weight:800}
.code-preview-close{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.06);color:#333;border:none;cursor:pointer;padding:0;transition:background .2s}
.code-preview-close:hover{background:rgba(0,0,0,.12)}
.code-preview-close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.code-preview-iframe{flex:1;width:100%;border:none;background:#fff}

.lightbox{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;background:#000;padding:0}
.lightbox.show{display:flex}
.lightbox img{width:100vw;height:100vh;max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;border-radius:0;box-shadow:none;display:block}

<script type="module">
import { initModelPicker, getActiveModel, askAIDynamic } from './ai-models.js';

const $ = (id) => document.getElementById(id);
const chatMessages = $('chatMessages'); const welcome = $('welcome');
const anonInput = $('anonInput'); const anonSendBtn = $('anonSendBtn');
const anonAttachBtn = $('anonAttachBtn'); const anonAttachMenu = $('anonAttachMenu');
const anonHiddenFileInput = $('anonHiddenFileInput');
const anonPendingPreview = $('anonPendingPreview'); const anonPreviewStrip = $('anonPreviewStrip');
const toast = $('toast'); const lightbox = $('lightbox');
const lightboxImg = $('lightboxImg'); const lightboxSave = $('lightboxSave');
const lightboxShare = $('lightboxShare'); const lightboxBack = $('lightboxBack');
const anonScrollBottomBtn = $('anonScrollBottomBtn');

const MAX_FILES = 10;

/* Ambil SVG mask dari DOM (hindari string super panjang di JS) */
function getMaskSVG() {
  var ref = document.querySelector('.anon-mask-badge svg') || document.querySelector('.welcome-mask svg');
  return ref ? ref.outerHTML : '<svg viewBox="0 0 50 50"></svg>';
}

/* Safe remove — tahan error */
function safeRemove(el) {
  if (!el) return;
  try {
    if (el.parentNode) el.parentNode.removeChild(el);
    else if (typeof el.remove === 'function') el.remove();
  } catch (_) {}
}

/* ⭐ FIX: Klik tombol model → tutup dulu attach-menu, lalu buka model picker.
   Pakai capture di window supaya jalan SEBELUM handler ai-models.js. */
window.addEventListener('click', function(e) {
  if (e.target && e.target.closest && e.target.closest('.model-btn')) {
    var open = document.querySelectorAll('.attach-menu.show');
    for (var i = 0; i < open.length; i++) open[i].classList.remove('show');
  }
}, true);

function generateUUID() { return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }
let spicyGuestId = null;
try { spicyGuestId = localStorage.getItem('bs_anon_spicy_guest'); } catch (_) {}
if (!spicyGuestId) { spicyGuestId = generateUUID(); try { localStorage.setItem('bs_anon_spicy_guest', spicyGuestId); } catch (_) {} }
let spicyConvId = null;
try { spicyConvId = sessionStorage.getItem('bs_anon_conv') || null; } catch (_) {}

initModelPicker({
  onChange: function(model) { showToast('Model: ' + (model.name || 'Default')); }
});

let toastTimer;
function showToast(text, ms) { ms = ms || 2200; toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), ms); }

let isStreaming = false;
let pendingFiles = [];
let userScrolledUp = false;

function updateSendBtn() { anonSendBtn.disabled = (!anonInput.value.trim() && !pendingFiles.length) || isStreaming; }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
function scrollToBottom(force) { if (!force && userScrolledUp) return; chatMessages.scrollTop = chatMessages.scrollHeight; setTimeout(checkScrollPos, 30); }
function checkScrollPos() {
  if (!anonScrollBottomBtn) return;
  const dist = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
  const atBottom = dist < 40;
  if (userScrolledUp && !atBottom) anonScrollBottomBtn.classList.add('show');
  else { anonScrollBottomBtn.classList.remove('show'); if (atBottom) userScrolledUp = false; }
}
let scrollEndTimer;
chatMessages.addEventListener('scroll', () => { clearTimeout(scrollEndTimer); scrollEndTimer = setTimeout(checkScrollPos, 80); }, { passive: true });
chatMessages.addEventListener('touchstart', () => { if (isStreaming) userScrolledUp = true; }, { passive: true });
chatMessages.addEventListener('wheel', () => { if (isStreaming) userScrolledUp = true; }, { passive: true });
anonScrollBottomBtn && anonScrollBottomBtn.addEventListener('click', () => {
  userScrolledUp = false; anonScrollBottomBtn.classList.remove('show');
  chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
});

function hideWelcome() { safeRemove(welcome); }
function ensureContainer() {
  let c = chatMessages.querySelector('.msg-container');
  if (!c) { c = document.createElement('div'); c.className = 'msg-container'; chatMessages.appendChild(c); }
  return c;
}

function parseCodeBlocks(text) {
  const regex = /```([a-zA-Z0-9_+\-]*)\n([\s\S]*?)```/g;
  const out = [];
  let last = 0, m;
  while ((m = regex.exec(text)) !== null) {
    if (m.index > last) out.push({ type: 'text', content: text.slice(last, m.index) });
    out.push({ type: 'code', lang: (m[1] || 'text').toLowerCase(), content: m[2].replace(/\n$/, '') });
    last = regex.lastIndex;
  }
  if (last < text.length) out.push({ type: 'text', content: text.slice(last) });
  return out;
}

function langLabel(lang) {
  const map = { html:'HTML', css:'CSS', js:'JavaScript', javascript:'JavaScript', ts:'TypeScript', typescript:'TypeScript', jsx:'JSX', tsx:'TSX', py:'Python', python:'Python', java:'Java', cpp:'C++', c:'C', cs:'C#', php:'PHP', rb:'Ruby', go:'Go', rs:'Rust', swift:'Swift', kt:'Kotlin', sh:'Shell', bash:'Bash', sql:'SQL', json:'JSON', xml:'XML', yaml:'YAML', yml:'YAML', md:'Markdown', markdown:'Markdown' };
  return map[lang] || (lang ? lang.toUpperCase() : 'CODE');
}

function buildCodeBoxTitle(langs) {
  const norm = langs.map(l => l === 'javascript' ? 'js' : l);
  const parts = [];
  if (norm.includes('html')) parts.push('HTML');
  if (norm.includes('css')) parts.push('CSS');
  if (norm.includes('js')) parts.push('JS');
  norm.filter(l => !['html','css','js'].includes(l)).forEach(o => parts.push(langLabel(o)));
  if (!parts.length) return 'Code';
  if (parts.length === 1) return parts[0];
  if (parts.length === 2) return parts[0] + ' & ' + parts[1];
  return parts.slice(0, -1).join(', ') + ' & ' + parts[parts.length - 1];
}

function renderMessageWithCode(bubble, text) {
  if (!text || text.indexOf('```') === -1) { bubble.textContent = text || ''; return; }
  const segs = parseCodeBlocks(text);
  if (!segs.some(s => s.type === 'code')) { bubble.textContent = text; return; }
  bubble.innerHTML = '';
  bubble.classList.add('has-code');
  let i = 0;
  while (i < segs.length) {
    const s = segs[i];
    if (s.type === 'text') {
      const t = s.content.trim();
      if (t) { const div = document.createElement('div'); div.className = 'msg-text-part'; div.textContent = t; bubble.appendChild(div); }
      i++;
    } else {
      const codes = [];
      while (i < segs.length && segs[i].type === 'code') { codes.push(segs[i]); i++; }
      bubble.appendChild(buildCodeBox(codes));
    }
  }
}

function buildCodeBox(codes) {
  const box = document.createElement('div');
  box.className = 'code-box';
  const langs = codes.map(c => c.lang === 'javascript' ? 'js' : c.lang);
  const uniqueLangs = [...new Set(langs.filter(l => l !== 'text'))];
  if (uniqueLangs.length === 0) uniqueLangs.push('text');
  let activeLang = uniqueLangs[0];
  const title = buildCodeBoxTitle(uniqueLangs);

  const header = document.createElement('div');
  header.className = 'code-box-header';
  const titleEl = document.createElement('span');
  titleEl.className = 'code-box-title';
  titleEl.textContent = title;
  header.appendChild(titleEl);

  const actions = document.createElement('div');
  actions.className = 'code-box-actions';

  const copyBtn = document.createElement('button');
  copyBtn.className = 'code-box-btn'; copyBtn.type = 'button'; copyBtn.title = 'Salin kode';
  copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

  const previewBtn = document.createElement('button');
  previewBtn.className = 'code-box-btn'; previewBtn.type = 'button'; previewBtn.title = 'Preview';
  previewBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const hasPreviewable = uniqueLangs.some(l => ['html','css','js'].includes(l));
  if (!hasPreviewable) previewBtn.style.display = 'none';

  actions.appendChild(copyBtn);
  actions.appendChild(previewBtn);
  header.appendChild(actions);
  box.appendChild(header);

  if (uniqueLangs.length > 1) {
    const tabs = document.createElement('div');
    tabs.className = 'code-box-tabs';
    uniqueLangs.forEach(l => {
      const tab = document.createElement('button');
      tab.className = 'code-tab' + (l === activeLang ? ' active' : '');
      tab.type = 'button'; tab.textContent = langLabel(l);
      tab.addEventListener('click', function() {
        tabs.querySelectorAll('.code-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        pre.querySelectorAll('code').forEach(c => { c.style.display = c.dataset.lang === l ? 'block' : 'none'; });
        activeLang = l;
      });
      tabs.appendChild(tab);
    });
    box.appendChild(tabs);
  }

  const pre = document.createElement('pre');
  pre.className = 'code-box-content';
  codes.forEach(c => {
    const codeEl = document.createElement('code');
    const lang = c.lang === 'javascript' ? 'js' : c.lang;
    codeEl.dataset.lang = lang;
    codeEl.textContent = c.content;
    codeEl.style.display = (uniqueLangs.length <= 1 || lang === activeLang) ? 'block' : 'none';
    pre.appendChild(codeEl);
  });
  box.appendChild(pre);

  copyBtn.addEventListener('click', async function() {
    let txt;
    if (uniqueLangs.length > 1) txt = codes.map(c => '```' + c.lang + '\n' + c.content + '\n```').join('\n\n');
    else txt = codes[0].content;
    try {
      await navigator.clipboard.writeText(txt);
      copyBtn.classList.add('copied');
      setTimeout(() => copyBtn.classList.remove('copied'), 1500);
    } catch (_) {}
  });

  previewBtn.addEventListener('click', function() { openCodePreview(codes); });
  return box;
}

function openCodePreview(codes) {
  const htmlCode = (codes.find(c => c.lang === 'html') || {}).content || '';
  const cssCode = (codes.find(c => c.lang === 'css') || {}).content || '';
  const jsCode = (codes.find(c => c.lang === 'js' || c.lang === 'javascript') || {}).content || '';

  let srcdoc;
  if (htmlCode) {
    let doc = htmlCode;
    if (cssCode) {
      if (doc.includes('</head>')) doc = doc.replace('</head>', '<style>' + cssCode + '</style></head>');
      else doc = '<style>' + cssCode + '</style>' + doc;
    }
    if (jsCode) {
      if (doc.includes('</body>')) doc = doc.replace('</body>', '<scr' + 'ipt>' + jsCode + '</scr' + 'ipt></body>');
      else doc = doc + '<scr' + 'ipt>' + jsCode + '</scr' + 'ipt>';
    }
    srcdoc = doc;
  } else {
    srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">';
    if (cssCode) srcdoc += '<style>' + cssCode + '</style>';
    srcdoc += '</head><body>';
    if (jsCode) srcdoc += '<scr' + 'ipt>' + jsCode + '</scr' + 'ipt>';
    srcdoc += '</body></html>';
  }

  let modal = document.getElementById('codePreviewModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'codePreviewModal';
    modal.className = 'code-preview-modal';
    modal.innerHTML = '<div class="code-preview-backdrop"></div><div class="code-preview-window"><div class="code-preview-header"><span>Preview</span><button class="code-preview-close" type="button" aria-label="Tutup"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><iframe class="code-preview-iframe" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe></div>';
    document.body.appendChild(modal);
    modal.querySelector('.code-preview-backdrop').addEventListener('click', closeCodePreview);
    modal.querySelector('.code-preview-close').addEventListener('click', closeCodePreview);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.classList.contains('show')) closeCodePreview();
    });
  }
  modal.querySelector('.code-preview-iframe').srcdoc = srcdoc;
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeCodePreview() {
  const modal = document.getElementById('codePreviewModal');
  if (modal) {
    modal.classList.remove('show');
    const iframe = modal.querySelector('.code-preview-iframe');
    if (iframe) iframe.srcdoc = '';
    document.body.style.overflow = '';
  }
}

function buildBubbleContent(bubble, text, files) {
  const hasText = text && text.trim();

  if (files && files.length) {
    if (files.length > 1) {
      const strip = document.createElement('div');
      strip.className = 'msg-attach-strip';
      files.forEach(f => {
        const cell = document.createElement('div');
        const isImage = f.dataUrl && f.type && f.type.startsWith('image/');
        cell.className = 'msg-attach-cell' + (isImage ? ' is-img' : '');
        if (isImage) {
          const im = document.createElement('img');
          im.src = f.dataUrl; im.className = 'msg-attach-cell-img'; im.alt = f.name;
          im.addEventListener('click', () => openLightbox(f.dataUrl, f.name));
          cell.appendChild(im);
        } else {
          const inner = document.createElement('div');
          inner.className = 'msg-attach-cell-file';
          const sizeKB = f.size ? (f.size / 1024).toFixed(1) + ' KB' : '';
          inner.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="msg-attach-cell-filename">' + (f.name || 'file') + '</div>' + (sizeKB ? '<div class="msg-attach-cell-filesize">' + sizeKB + '</div>' : '');
          cell.appendChild(inner);
        }
        strip.appendChild(cell);
      });
      bubble.appendChild(strip);
    } else {
      const f = files[0];
      const isImage = f.dataUrl && f.type && f.type.startsWith('image/');
      if (isImage) {
        const img = document.createElement('img');
        img.src = f.dataUrl; img.className = 'msg-image'; img.alt = f.name;
        img.addEventListener('click', () => openLightbox(f.dataUrl, f.name));
        bubble.appendChild(img);
      } else {
        const card = document.createElement('div'); card.className = 'msg-file';
        const sizeKB = f.size ? (f.size / 1024).toFixed(1) + ' KB' : '';
        card.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><div class="msg-file-info"><div class="msg-file-name">' + (f.name || 'file') + '</div>' + (sizeKB ? '<div class="msg-file-size">' + sizeKB + '</div>' : '') + '</div>';
        bubble.appendChild(card);
      }
    }
    if (hasText) { const cap = document.createElement('div'); cap.className = 'msg-caption'; cap.textContent = text; bubble.appendChild(cap); }
    return 'file-only';
  }

  renderMessageWithCode(bubble, text || '');
  return 'text';
}

let lightboxCurrentDataUrl = null, lightboxCurrentName = 'image.jpg';
function openLightbox(d, n) { lightboxCurrentDataUrl = d; lightboxCurrentName = n || 'image.jpg'; lightboxImg.src = d; lightbox.classList.add('show'); }
function closeLightbox() { lightbox.classList.remove('show'); lightboxImg.src = ''; lightboxCurrentDataUrl = null; }
lightboxBack.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('show')) closeLightbox(); });
lightboxSave.addEventListener('click', (e) => {
  e.stopPropagation(); if (!lightboxCurrentDataUrl) return;
  const a = document.createElement('a'); a.href = lightboxCurrentDataUrl; a.download = lightboxCurrentName;
  document.body.appendChild(a); a.click(); safeRemove(a);
  showToast('Gambar disimpan');
});
lightboxShare.addEventListener('click', async (e) => {
  e.stopPropagation(); if (!lightboxCurrentDataUrl) return;
  try {
    if (navigator.share && navigator.canShare) {
      const blob = await (await fetch(lightboxCurrentDataUrl)).blob();
      const file = new File([blob], lightboxCurrentName, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: lightboxCurrentName }); return; }
      await navigator.share({ title: lightboxCurrentName, url: lightboxCurrentDataUrl }); return;
    }
    if (navigator.clipboard) { await navigator.clipboard.writeText(lightboxCurrentDataUrl); showToast('Data gambar dicopy'); return; }
    showToast('Share tidak didukung');
  } catch (err) { if (err && err.name === 'AbortError') return; showToast('Gagal membagikan'); }
});

function renderPendingPreview() {
  if (!pendingFiles.length) { anonPendingPreview.classList.remove('show'); return; }
  anonPreviewStrip.innerHTML = '';
  pendingFiles.forEach((item, idx) => {
    const cell = document.createElement('div');
    cell.className = 'pending-cell' + (item.dataUrl ? ' is-img' : '');
    if (item.dataUrl) {
      const img = document.createElement('img'); img.src = item.dataUrl; img.className = 'pending-cell-img'; img.alt = item.name;
      cell.appendChild(img);
    } else {
      const icon = document.createElement('div'); icon.className = 'pending-cell-icon';
      icon.innerHTML = '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
      cell.appendChild(icon);
      const nm = document.createElement('div'); nm.className = 'pending-cell-name'; nm.textContent = item.name;
      cell.appendChild(nm);
    }
    const rm = document.createElement('button'); rm.className = 'pending-cell-remove'; rm.type = 'button';
    rm.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    rm.addEventListener('click', (e) => { e.stopPropagation(); pendingFiles.splice(idx, 1); renderPendingPreview(); updateSendBtn(); });
    cell.appendChild(rm); anonPreviewStrip.appendChild(cell);
  });
  anonPendingPreview.classList.add('show');
  requestAnimationFrame(() => { anonPreviewStrip.scrollLeft = anonPreviewStrip.scrollWidth; });
}

async function handleSend() {
  if (isStreaming) return;
  const text = (anonInput.value || '').trim();
  if (!text && !pendingFiles.length) return;

  const filesSnapshot = pendingFiles.map(f => ({ name: f.name, type: f.type, size: f.size, dataUrl: f.dataUrl }));
  pendingFiles = [];
  renderPendingPreview();

  hideWelcome();
  const container = ensureContainer();

  const userMsg = document.createElement('div'); userMsg.className = 'msg user';
  const userBubble = document.createElement('div'); userBubble.className = 'msg-bubble';
  const kind = buildBubbleContent(userBubble, text, filesSnapshot);
  if (kind === 'file-only') userMsg.classList.add('file-only');
  userMsg.appendChild(userBubble); container.appendChild(userMsg);

  anonInput.value = ''; anonInput.style.height = 'auto';
  updateSendBtn(); userScrolledUp = false; scrollToBottom(true);
  isStreaming = true; updateSendBtn();

  const typingMsg = document.createElement('div');
  typingMsg.className = 'msg ai'; typingMsg.id = 'typingIndicator';
  const typingBubble = document.createElement('div'); typingBubble.className = 'msg-bubble';
  typingBubble.innerHTML =
    '<div class="ai-thinking">' +
      '<span class="ai-mask-icon">' + getMaskSVG() + '</span>' +
      '<span class="ai-thinking-text">Anonymous sedang berpikir</span>' +
      '<span class="ai-thinking-dots"><span></span><span></span><span></span></span>' +
    '</div>';
  typingMsg.appendChild(typingBubble); container.appendChild(typingMsg);
  scrollToBottom();

  let reply;
  try {
    const fileNames = filesSnapshot.map(f => f.name).join(', ');
    const aiText = text || (fileNames ? '[' + fileNames + ']' : '');
    const model = getActiveModel();
    const result = await askAIDynamic(model, aiText, spicyConvId, spicyGuestId);
    reply = result.reply;
    if (result.conversationId) {
      spicyConvId = result.conversationId;
      try { sessionStorage.setItem('bs_anon_conv', result.conversationId); } catch (_) {}
    }
  } catch (err) { reply = 'AI error: ' + (err.message || 'Unknown error'); }

  const tEl = document.getElementById('typingIndicator');
  safeRemove(tEl);

  const aiMsg = document.createElement('div'); aiMsg.className = 'msg ai';
  const aiBubble = document.createElement('div'); aiBubble.className = 'msg-bubble';
  aiMsg.appendChild(aiBubble); container.appendChild(aiMsg); scrollToBottom();

  let i = 0;
  while (i < reply.length) {
    i += 2; aiBubble.textContent = reply.slice(0, i);
    if (!userScrolledUp) chatMessages.scrollTop = chatMessages.scrollHeight;
    await new Promise(r => setTimeout(r, 16));
  }
  renderMessageWithCode(aiBubble, reply);
  if (!userScrolledUp) scrollToBottom(true);
  checkScrollPos();

  isStreaming = false; updateSendBtn(); checkScrollPos();
}

anonInput.addEventListener('input', () => { autoResize(anonInput); updateSendBtn(); });
anonInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });
anonSendBtn.addEventListener('click', handleSend);

anonAttachBtn.addEventListener('click', (e) => { e.stopPropagation(); anonAttachMenu.classList.toggle('show'); });
anonAttachMenu.querySelectorAll('.attach-item').forEach((item) => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    const type = item.dataset.attach;
    anonAttachMenu.classList.remove('show');
    if (type === 'support') { showToast('Support Me - coming soon'); return; }
    setTimeout(function() {
      anonHiddenFileInput.multiple = true;
      anonHiddenFileInput.accept = (type === 'image') ? 'image/*' : '*/*';
      anonHiddenFileInput.value = '';
      anonHiddenFileInput.click();
    }, 220);
  });
});

anonHiddenFileInput.addEventListener('change', async function() {
  const pickedFiles = Array.from(anonHiddenFileInput.files || []);
  anonHiddenFileInput.value = '';
  if (!pickedFiles.length) return;

  const slotsLeft = MAX_FILES - pendingFiles.length;
  if (slotsLeft <= 0) { showToast('Maksimal ' + MAX_FILES + ' file'); return; }
  if (pickedFiles.length > slotsLeft) showToast('Cuma bisa tambah ' + slotsLeft + ' file lagi');
  const toAdd = pickedFiles.slice(0, slotsLeft);

  const rawDataUrls = await Promise.all(toAdd.map(file => new Promise(resolve => {
    try { const r = new FileReader(); r.onload = e => resolve(e.target.result); r.onerror = () => resolve(null); r.readAsDataURL(file); }
    catch (_) { resolve(null); }
  })));

  const processed = await Promise.all(rawDataUrls.map(async (raw, i) => {
    const file = toAdd[i];
    const isImage = file.type && file.type.startsWith('image/');
    const it = { name: file.name, type: file.type, size: file.size, dataUrl: null };
    if (isImage && raw) {
      try { it.dataUrl = await compressFromDataUrl(raw, 700, 0.7); } catch (_) { it.dataUrl = raw; }
    }
    return it;
  }));

  processed.forEach(it => pendingFiles.push(it));
  renderPendingPreview(); updateSendBtn();
  anonInput.focus();
});

function compressFromDataUrl(dataUrl, maxSize, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const out = c.toDataURL('image/jpeg', quality);
        resolve(out.length < dataUrl.length ? out : dataUrl);
      } catch (_) { resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

document.addEventListener('click', function() {
  document.querySelectorAll('.attach-menu.show').forEach(function(m){ m.classList.remove('show'); });
});

updateSendBtn();
</script>
